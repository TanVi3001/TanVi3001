<!doctype html><html lang="en"><meta charset="utf-8"><title>Profile neural field</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1000px;height:356px;background:#f6f3ec;color:#16140f;font-family:Arial,sans-serif}.card{position:absolute;inset:14px 24px 22px 14px;background:#fbf9f2;border:3px solid #16140f;border-radius:12px;box-shadow:7px 7px 0 #16140f;overflow:hidden}.top{height:39px;border-bottom:2px solid #16140f;background:#eae5d9;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:11px monospace;letter-spacing:1.2px}.dots{display:flex;gap:7px}.dots i{width:9px;height:9px;background:#ffc730;border:1.5px solid #16140f;border-radius:50%}.dots i:nth-child(2){background:#a26bff}.dots i:nth-child(3){background:#b6ec2c}.tag{background:#b6ec2c;padding:4px 9px;border:1.5px solid #16140f;border-radius:3px;font-weight:700;letter-spacing:0}.copy{position:absolute;left:28px;top:70px;width:355px;z-index:2}.eyebrow{font:11px monospace;letter-spacing:1px;margin-bottom:17px;color:#665e50}h1{font-size:46px;line-height:1.06;letter-spacing:-2px;margin:0 0 17px;font-weight:800}h1 span{display:inline-block;background:#ffc730;border:2px solid #16140f;padding:3px 9px;box-shadow:3px 3px 0 #16140f;transform:rotate(-2deg)}.copy p{font-size:13px;color:#625a4d;margin:18px 0}.topics{display:flex;gap:7px;font:10px monospace}.topics span{border:1.5px solid #16140f;padding:5px 7px;background:#d4c5f2;border-radius:3px}.topics span:nth-child(2){background:#c8dfff}.topics span:nth-child(3){background:#d2e9a9}#scene{position:absolute;left:390px;right:0;top:40px;bottom:29px}canvas{display:block}.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;height:29px;border-top:1.5px solid #16140f;padding:0 18px;background:#16140f;color:#f6f3ec;font:10px monospace;letter-spacing:.2px}.bottom span:first-child{color:#ffc730}
</style><div class="card"><div class="top"><span class="dots"><i></i><i></i><i></i></span><span>NEURAL FIELD / 01</span><span class="tag">AI + CV</span></div><div class="copy"><div class="eyebrow">A LITTLE CODE. A LOT OF CURIOSITY.</div><h1>From data<br/>to <span>impact.</span></h1><p>Learning every day, building with purpose.</p><div class="topics"><span>Computer Vision</span><span>Time Series</span><span>Research</span></div></div><div id="scene"></div><div class="bottom"><span>INPUT → REPRESENTATION → OUTPUT</span><span>EXPLORE THE INTERACTIVE PORTFOLIO ↗</span></div></div>
<script type="module">
import * as THREE from '/three/three.module.js';
const host=document.querySelector('#scene');const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(37,host.clientWidth/host.clientHeight,.1,100);camera.position.set(5,2.8,14);camera.lookAt(0,-.1,0);scene.add(new THREE.HemisphereLight(0xffffff,0xd2c4aa,2.5));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-4,7,10);scene.add(light);const group=new THREE.Group();scene.add(group);
const counts=[3,5,4,2],colors=[0x3d8bff,0xa26bff,0xffc730,0xb6ec2c],layers=[],balls=[];const sphere=new THREE.SphereGeometry(.26,24,20);
counts.forEach((n,l)=>{const mat=new THREE.MeshPhysicalMaterial({color:colors[l],roughness:.3,metalness:.08,clearcoat:.7});layers[l]=[];for(let i=0;i<n;i++){const p=new THREE.Vector3((l-1.5)*2.15,(i-(n-1)/2)*1.03,Math.sin(i*1.8+l)*.55);layers[l].push(p);const ball=new THREE.Mesh(sphere,mat);ball.position.copy(p);group.add(ball);balls.push(ball);const ring=new THREE.Mesh(new THREE.TorusGeometry(.31,.02,6,32),new THREE.MeshBasicMaterial({color:0x16140f}));ring.position.copy(p);group.add(ring);}});
const pulses=[],wire=new THREE.LineBasicMaterial({color:0x655b4b,transparent:true,opacity:.26}),pulseGeo=new THREE.SphereGeometry(.065,10,8),pulseMat=new THREE.MeshBasicMaterial({color:0x3d8bff});for(let l=0;l<3;l++)layers[l].forEach((a,i)=>layers[l+1].forEach((b,j)=>{group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),wire));if((i+j)%2===0){const mesh=new THREE.Mesh(pulseGeo,pulseMat);group.add(mesh);pulses.push({mesh,a,b,phase:(i*.19+j*.11+l*.31)%1});}}));
const grid=new THREE.GridHelper(12,16,0xcfc2a6,0xe5dcc9);grid.position.y=-2.9;scene.add(grid);
window.renderFrame=t=>{const theta=t*Math.PI*2;group.rotation.y=-.14+Math.sin(theta)*.27;group.rotation.x=Math.cos(theta)*.035;group.rotation.z=-.045;balls.forEach((b,i)=>b.scale.setScalar(1+Math.sin(theta*2+i*.8)*.035));pulses.forEach(p=>p.mesh.position.lerpVectors(p.a,p.b,(t*2+p.phase)%1));renderer.render(scene,camera);};window.renderFrame(0);window.sceneReady=true;
</script></html>
