<!doctype html><html lang="en"><meta charset="utf-8"><title>Profile neural field</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1000px;height:356px;background:#070610;color:#f4f0ff;font-family:Arial,sans-serif}.card{position:absolute;inset:10px;border:1px solid #35234c;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 72% 40%,#281342 0,transparent 53%),linear-gradient(130deg,#090713,#110a20)}.card:before{content:"";position:absolute;inset:39px 0 28px;background-image:radial-gradient(#a488c4 0.7px,transparent 0.7px);background-size:49px 43px;opacity:.14}.top{height:39px;border-bottom:1px solid #36234e;background:#100b1b;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font:10px monospace;letter-spacing:1.4px;color:#b49bcc}.dots{display:flex;gap:7px}.dots i{width:7px;height:7px;background:#a78bfa;border-radius:50%;box-shadow:0 0 7px #8b5cf6}.dots i:nth-child(2){background:#8b5cf6}.dots i:nth-child(3){background:#d8b4fe}.tag{background:#241235;color:#d8b4fe;padding:5px 11px;border:1px solid #5c3883;border-radius:20px;font-weight:500;letter-spacing:.8px}.copy{position:absolute;left:30px;top:74px;width:355px;z-index:2}.eyebrow{font:10px monospace;letter-spacing:1.5px;margin-bottom:20px;color:#ac90c9}h1{font-size:47px;line-height:1.13;letter-spacing:-1.6px;margin:0 0 18px;font-weight:500}h1 span{background:linear-gradient(100deg,#c4b5fd,#a06dff,#d8a3ff);background-clip:text;-webkit-background-clip:text;color:transparent;font-weight:600}.copy p{font-size:13px;color:#aa9bbf;margin:18px 0}.topics{display:flex;gap:8px;font:10px monospace}.topics span{border:1px solid #4b306c;padding:6px 9px;background:#21112f;color:#d6c4ef;border-radius:20px}#scene{position:absolute;left:390px;right:0;top:40px;bottom:29px}canvas{display:block}.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;height:29px;border-top:1px solid #342249;padding:0 20px;background:#0b0714;color:#9c89b2;font:9px monospace;letter-spacing:.4px}.bottom span:first-child{color:#bba2f2}
</style><div class="card"><div class="top"><span class="dots"><i></i><i></i><i></i></span><span>NEURAL FIELD / 01</span><span class="tag">AI + CV</span></div><div class="copy"><div class="eyebrow">A LITTLE CODE. A LOT OF CURIOSITY.</div><h1>From data<br/>to <span>impact.</span></h1><p>Learning every day, building with purpose.</p><div class="topics"><span>Computer Vision</span><span>Time Series</span><span>Research</span></div></div><div id="scene"></div><div class="bottom"><span>INPUT → REPRESENTATION → OUTPUT</span><span>EXPLORE THE INTERACTIVE PORTFOLIO ↗</span></div></div>
<script type="module">
import * as THREE from '/three/three.module.js';
const host=document.querySelector('#scene');const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(37,host.clientWidth/host.clientHeight,.1,100);camera.position.set(5,2.8,14);camera.lookAt(0,-.1,0);scene.add(new THREE.HemisphereLight(0xffffff,0x342044,2.5));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-4,7,10);scene.add(light);const group=new THREE.Group();scene.add(group);
const counts=[3,5,4,2],colors=[0x8b5cf6,0xb794f6,0x9d6de5,0xd8b4fe],layers=[],balls=[];const sphere=new THREE.SphereGeometry(.26,24,20);
counts.forEach((n,l)=>{const mat=new THREE.MeshPhysicalMaterial({color:colors[l],roughness:.22,metalness:.25,clearcoat:.8,emissive:colors[l],emissiveIntensity:.2});layers[l]=[];for(let i=0;i<n;i++){const p=new THREE.Vector3((l-1.5)*2.15,(i-(n-1)/2)*1.03,Math.sin(i*1.8+l)*.55);layers[l].push(p);const ball=new THREE.Mesh(sphere,mat);ball.position.copy(p);group.add(ball);balls.push(ball);const ring=new THREE.Mesh(new THREE.TorusGeometry(.31,.02,6,32),new THREE.MeshBasicMaterial({color:0xb38bdf}));ring.position.copy(p);group.add(ring);}});
const pulses=[],wire=new THREE.LineBasicMaterial({color:0x9465cc,transparent:true,opacity:.33}),pulseGeo=new THREE.SphereGeometry(.065,10,8),pulseMat=new THREE.MeshBasicMaterial({color:0xe4c8ff});for(let l=0;l<3;l++)layers[l].forEach((a,i)=>layers[l+1].forEach((b,j)=>{group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),wire));if((i+j)%2===0){const mesh=new THREE.Mesh(pulseGeo,pulseMat);group.add(mesh);pulses.push({mesh,a,b,phase:(i*.19+j*.11+l*.31)%1});}}));
const grid=new THREE.GridHelper(12,16,0x48296a,0x261633);grid.position.y=-2.9;scene.add(grid);
window.renderFrame=t=>{const theta=t*Math.PI*2;group.rotation.y=-.14+Math.sin(theta)*.27;group.rotation.x=Math.cos(theta)*.035;group.rotation.z=-.045;balls.forEach((b,i)=>b.scale.setScalar(1+Math.sin(theta*2+i*.8)*.035));pulses.forEach(p=>p.mesh.position.lerpVectors(p.a,p.b,(t*2+p.phase)%1));renderer.render(scene,camera);};window.renderFrame(0);window.sceneReady=true;
</script></html>
